# Single-host production: nginx (static + API proxy) + API + worker
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend-cloudflare:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - .env
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    depends_on:
      api:
        condition: service_healthy

volumes:
  agency_data:
  agency_reports:
