services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/agency.db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-sqlite:///./data/agency.db}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8788}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STAGE_DELAY_SECONDS: ${STAGE_DELAY_SECONDS:-3600}
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/agency.db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-sqlite:///./data/agency.db}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8788}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STAGE_DELAY_SECONDS: ${STAGE_DELAY_SECONDS:-3600}
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    depends_on:
      api:
        condition: service_healthy

volumes:
  agency_data:
  agency_reports:
