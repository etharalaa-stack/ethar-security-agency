# Coolify on Hetzner — full stack (web + api + worker)
#
# Coolify UI:
#   Build pack: Docker Compose
#   Compose file: docker-compose.coolify.yml
#   Public domain: attach ONLY to service "web" (port 80)
#   Environment: paste from .env.coolify.example (api + worker read same vars from Coolify)
#
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Coolify: route public HTTPS to nginx on internal port 80 (not 8000).
      SERVICE_FQDN_WEB_80: /
    labels:
      - coolify.managed=true
      - coolify.type=application
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build: .
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.type=application
    environment:
      PORT: "8000"
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    build: .
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.type=application
    command: python -m app.worker
    volumes:
      - agency_data:/app/data
      - agency_reports:/app/generated_reports
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: localhost", "http://api:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  agency_data:
  agency_reports:
